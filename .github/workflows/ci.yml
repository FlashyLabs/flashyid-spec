name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # No install step, deliberately: this repository declares no dependency,
      # and a check that needs an install is a check that can quietly not run.
      - run: npm run lint
      - run: npm test
